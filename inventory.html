<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Full Inventory — L.K. Collectibles</title>
  <meta name="description" content="Browse our complete eBay inventory — live and updated hourly." />
  <style>
    :root {
      --bg: #121212; --bg-elevated: #1a1a1a; --card: #1c1c1c; --card-hover: #222222;
      --gold: #c9a24b; --gold-bright: #e0bc5e; --gold-dim: #9a7a35;
      --text: #e8e6e3; --text-secondary: #b0aca8; --muted: #6e6a66;
      --border: #2a2a2a; --border-hover: #3a3a3a; --radius: 14px; --radius-sm: 8px; --max-width: 1240px;
      --serif: 'Playfair Display', 'Georgia', 'Times New Roman', serif;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--sans); background: var(--bg); color: var(--text); line-height: 1.7; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    a { color: var(--gold); text-decoration: none; transition: color 0.3s ease; }
    a:hover { color: var(--gold-bright); }
    img { display: block; max-width: 100%; }
    nav { position: sticky; top: 0; z-index: 100; background: rgba(18,18,18,0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); }
    .nav-inner { max-width: var(--max-width); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 88px; padding: 0 2rem; }
    .nav-logo { display: flex; align-items: center; gap: 0.6rem; font-family: var(--serif); font-size: 1.35rem; font-weight: 700; color: var(--gold); letter-spacing: 1.5px; text-decoration: none; }
    .nav-logo-img { height: 72px; width: auto; border-radius: 6px; object-fit: contain; }
    .nav-logo span { color: var(--text); font-weight: 400; }
    .nav-links { display: flex; gap: 2rem; align-items: center; }
    .nav-links a { color: var(--text-secondary); font-size: 0.9rem; font-weight: 500; text-decoration: none; letter-spacing: 0.5px; transition: color 0.3s ease; position: relative; }
    .nav-links a::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 1px; background: var(--gold); transition: width 0.3s ease; }
    .nav-links a:hover { color: var(--gold); }
    .nav-links a:hover::after { width: 100%; }
    .nav-cta { background: transparent; border: 1px solid var(--gold); color: var(--gold) !important; padding: 0.5rem 1.4rem; border-radius: var(--radius-sm); font-weight: 600; letter-spacing: 0.5px; }
    .nav-cta::after { display: none; }
    .nav-cta:hover { background: var(--gold); color: #121212 !important; }
    .page-header { text-align: center; padding: 4rem 2rem 2rem; background: linear-gradient(180deg, var(--bg-elevated) 0%, var(--bg) 100%); position: relative; overflow: hidden; }
    .page-header::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 600px; height: 400px; background: radial-gradient(circle, rgba(201,162,75,0.05) 0%, transparent 70%); pointer-events: none; }
    .page-header h1 { font-family: var(--serif); font-size: 2.8rem; font-weight: 700; color: var(--text); letter-spacing: 0.5px; margin-bottom: 0.75rem; position: relative; }
    .page-header p { color: var(--text-secondary); font-size: 1.05rem; font-weight: 300; position: relative; }
    .toolbar { max-width: var(--max-width); margin: 0 auto; padding: 1.5rem 2rem 1.5rem; display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: center; justify-content: space-between; }
    .sync-info { color: var(--muted); font-size: 0.82rem; display: flex; align-items: center; gap: 0.5rem; }
    .sync-info .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px rgba(201,162,75,0.4); animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .search-bar { flex: 1; max-width: 380px; position: relative; }
    .search-bar input { width: 100%; padding: 0.8rem 1rem 0.8rem 2.75rem; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 0.95rem; font-family: var(--sans); transition: border-color 0.3s ease; }
    .search-bar input::placeholder { color: var(--muted); }
    .search-bar input:focus { outline: none; border-color: var(--gold); }
    .search-bar svg { position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
    .categories { max-width: var(--max-width); margin: 0 auto; padding: 0 2rem 2rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .cat-pill { padding: 0.4rem 1.1rem; border-radius: 24px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); font-size: 0.82rem; font-weight: 500; cursor: pointer; transition: all 0.3s ease; letter-spacing: 0.3px; }
    .cat-pill:hover { border-color: var(--gold); color: var(--gold); }
    .cat-pill.active { background: var(--gold); color: #121212; border-color: var(--gold); font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.75rem; max-width: var(--max-width); margin: 0 auto; padding: 0 2rem 4rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: transform 0.35s cubic-bezier(0.4,0,0.2,1), border-color 0.3s ease, box-shadow 0.35s ease; }
    .card:hover { transform: translateY(-6px); border-color: var(--border-hover); box-shadow: 0 12px 40px rgba(0,0,0,0.4); }
    .card-image-wrap { position: relative; overflow: hidden; background: #1a1a1a; }
    .card-image-wrap img { width: 100%; height: 280px; object-fit: cover; transition: transform 0.5s cubic-bezier(0.4,0,0.2,1); }
    .card:hover .card-image-wrap img { transform: scale(1.05); }
    .card-placeholder { height: 280px; display: flex; align-items: center; justify-content: center; background: #1a1a1a; color: #444; font-size: 0.85rem; font-style: italic; }
    .card-body { padding: 1.25rem 1.25rem 1.5rem; }
    .card-body h3 { font-family: var(--serif); font-size: 1.05rem; font-weight: 600; line-height: 1.4; margin-bottom: 0.75rem; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .price { font-size: 1.35rem; font-weight: 700; color: var(--gold); font-family: var(--sans); }
    .condition { font-size: 0.72rem; padding: 0.25rem 0.7rem; border-radius: 20px; border: 1px solid var(--border-hover); color: var(--text-secondary); letter-spacing: 0.5px; text-transform: uppercase; font-weight: 500; }
    .card-link { display: block; text-align: center; padding: 0.65rem; background: transparent; border: 1px solid var(--border-hover); color: var(--gold); text-decoration: none; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.82rem; letter-spacing: 1px; text-transform: uppercase; transition: all 0.3s ease; }
    .card-link:hover { background: var(--gold); color: #121212; border-color: var(--gold); }
    .card-actions { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.75rem; }
    .card-actions-row { display: flex; gap: 0.5rem; }
    .pay-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.55rem 0.5rem; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.72rem; letter-spacing: 0.5px; text-transform: uppercase; text-decoration: none; transition: all 0.3s ease; cursor: pointer; }
    .pay-paypal { background: #ffc439; color: #003087; border: 1px solid #ffc439; }
    .pay-paypal:hover { background: #ffb302; border-color: #ffb302; }
    .pay-stripe { background: #635bff; color: #fff; border: 1px solid #635bff; }
    .pay-stripe:hover { background: #5a52e0; border-color: #5a52e0; }
    .inquire-btn { display: block; text-align: center; padding: 0.55rem; background: transparent; border: 1px solid var(--border-hover); color: var(--gold); text-decoration: none; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.78rem; letter-spacing: 1px; text-transform: uppercase; transition: all 0.3s ease; cursor: pointer; }
    .inquire-btn:hover { background: var(--gold); color: #121212; border-color: var(--gold); }
    .loading, .error, .empty { text-align: center; padding: 4rem 2rem; color: var(--muted); grid-column: 1 / -1; }
    .error { color: #c75450; }
    .spinner { border: 2px solid var(--border); border-top: 2px solid var(--gold); border-radius: 50%; width: 36px; height: 36px; animation: spin 0.8s linear infinite; margin: 0 auto 1.25rem; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    footer { text-align: center; padding: 3rem 2rem; color: var(--muted); font-size: 0.85rem; border-top: 1px solid var(--border); }
    footer .footer-logo { font-family: var(--serif); font-size: 1.2rem; color: var(--gold-dim); margin-bottom: 1rem; letter-spacing: 1.5px; }
    footer .footer-links { display: flex; justify-content: center; gap: 2rem; margin-bottom: 1.5rem; }
    footer .footer-links a { color: var(--text-secondary); font-size: 0.85rem; letter-spacing: 0.5px; }
    footer .footer-links a:hover { color: var(--gold); }
    footer .footer-copy { color: var(--muted); font-size: 0.8rem; }
    @media (max-width: 768px) {
      .nav-inner { padding: 0 1rem; height: 72px; }
      .nav-links { gap: 1rem; }
      .nav-links a:not(.nav-cta) { display: none; }
      .page-header { padding: 3rem 1.5rem 1.5rem; }
      .page-header h1 { font-size: 2rem; }
      .toolbar { padding: 1rem 1.5rem; flex-direction: column; align-items: stretch; }
      .search-bar { max-width: none; }
      .categories { padding: 0 1.5rem 1.5rem; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; padding: 0 1.5rem 3rem; }
      .card-image-wrap img, .card-placeholder { height: 180px; }
      .card-body { padding: 0.85rem 0.85rem 1.1rem; }
      .card-body h3 { font-size: 0.9rem; }
      .price { font-size: 1.1rem; }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <img src="https://assets.lkcollectibles.com/logo-v2.png?v=2" alt="L.K. Collectibles" class="nav-logo-img" />
      </a>
      <div class="nav-links">
        <a href="/#featured">Featured</a>
        <a href="/inventory">Full Inventory</a>
        <a href="/#about">About</a>
        <a href="https://www.ebay.com/usr/l.k.-collectibles" target="_blank" rel="noopener" class="nav-cta">eBay Store</a>
      </div>
    </div>
  </nav>
  <section class="page-header">
    <h1>Full Inventory</h1>
    <p>Our complete eBay store — synced live, updated hourly</p>
  </section>
  <div class="toolbar">
    <div class="sync-info" id="syncInfo">
      <span class="dot"></span>
      <span>Loading inventory...</span>
    </div>
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" placeholder="Search inventory..." oninput="filterItems()" />
    </div>
  </div>
  <div class="categories" id="categories"></div>
  <div class="grid" id="inventory">
    <div class="loading">
      <div class="spinner"></div>
      Loading inventory from eBay...
    </div>
  </div>
  <footer>
    <div class="footer-logo">
      <img src="https://assets.lkcollectibles.com/logo-v2.png?v=2" alt="L.K. Collectibles" style="height:40px;width:auto;border-radius:6px;display:block;margin:0 auto 1rem;" />
      L.K. Collectibles
    </div>
    <div class="footer-links">
      <a href="/">Home</a>
      <a href="/inventory">Full Inventory</a>
      <a href="/#about">About</a>
      <a href="https://www.ebay.com/usr/l.k.-collectibles" target="_blank" rel="noopener">eBay Store</a>
    </div>
    <div class="footer-copy">&copy; 2026 L.K. Collectibles — Inventory synced live via eBay API</div>
  </footer>
  <script src="https://www.paypal.com/sdk/js?client-id=BAAOgpHH83VMFggJ4PZtfT9azQDeHxUSSMKgQd5qJi_pQua8ICMNIsyQizwlsIir6eI0Eybbhw7lw1VizY&components=hosted-buttons&enable-funding=venmo&currency=USD"></script>
  <script>
    const INVENTORY_API = "https://ebay-inventory-sync.damp-recipe-0abe.workers.dev/api/inventory";
    const STRIPE_LINK = "https://buy.stripe.com/8x27sL88x0VE3dH9IJds41g";
    const PAYPAL_BUSINESS = "info@lkcollectibles.com";
    let allItems = [];
    let activeCategory = "All";
    async function loadInventory() {
      try {
        const resp = await fetch(INVENTORY_API);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        allItems = data.items || [];
        if (data.syncedAt) {
          const syncTime = new Date(data.syncedAt).toLocaleString();
          document.getElementById("syncInfo").innerHTML = `<span class="dot"></span><span>Showing ${data.count} items — last synced ${syncTime}</span>`;
        }
        renderCategories();
        renderItems(allItems);
      } catch (err) {
        document.getElementById("inventory").innerHTML = `<div class="error">Could not load inventory: ${err.message}<br><br>Make sure the Worker is deployed and the URL in INVENTORY_API is correct.</div>`;
        document.getElementById("syncInfo").innerHTML = '<span class="dot" style="background:#c75450"></span><span>Unable to connect</span>';
      }
    }
    function renderCategories() {
      const catSet = new Set();
      allItems.forEach(item => { (item.categories || []).forEach(c => catSet.add(c)); });
      const categories = ["All", ...Array.from(catSet).sort()];
      const container = document.getElementById("categories");
      container.innerHTML = categories.map(cat => { const isActive = cat === activeCategory; return `<span class="cat-pill ${isActive ? 'active' : ''}" onclick="selectCategory(${escapeAttr(cat)})">${escapeHtml(cat)}</span>`; }).join("");
    }
    function selectCategory(cat) { activeCategory = cat; renderCategories(); filterItems(); }
    function filterItems() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = allItems.filter(item => {
        const matchesSearch = !query || item.title.toLowerCase().includes(query) || (item.categories || []).some(c => c.toLowerCase().includes(query));
        const matchesCat = activeCategory === "All" || (item.categories || []).includes(activeCategory);
        return matchesSearch && matchesCat;
      });
      renderItems(filtered);
    }
    function renderItems(items) {
      const container = document.getElementById("inventory");
      if (!items || items.length === 0) { container.innerHTML = '<div class="empty">No items found. Try a different search or category.</div>'; return; }
      container.innerHTML = items.map((item, idx) => {
        const img = item.thumbnail || item.image || "";
        const price = item.price ? `${item.price}` : "Price N/A";
        const condition = item.condition ? `<span class="condition">${escapeHtml(item.condition)}</span>` : "";
        const imgHtml = img ? `<div class="card-image-wrap"><img src="${img}" alt="${escapeHtml(item.title)}" loading="lazy" onerror="this.parentElement.className='card-placeholder';this.parentElement.textContent='No image available'"></div>` : `<div class="card-placeholder">No image available</div>`;
        const ebayUrl = item.itemWebUrl || "#";
        const rawPrice = parseFloat(item.price) || 0;
        const itemTitle = escapeHtml(item.title || 'L.K. Collectibles Item');
        return `<div class="card" data-item-idx="${idx}">${imgHtml}<div class="card-body"><h3>${itemTitle}</h3><div class="card-meta"><span class="price">${price}</span>${condition}</div><a href="${ebayUrl}" target="_blank" rel="noopener" class="card-link">View on eBay</a><div class="card-actions"><div class="card-actions-row"><button type="button" class="pay-btn pay-paypal" data-paypal-idx="${idx}" data-amount="${rawPrice}" data-title="${itemTitle}">PayPal</button><a href="${STRIPE_LINK}" target="_blank" rel="noopener" class="pay-btn pay-stripe">Card (Stripe)</a></div><a href="mailto:info@lkcollectibles.com?subject=Inquiry%20about%3A%20${encodeURIComponent(item.title || '')}" class="inquire-btn">Inquire</a></div></div></div>`;
      }).join("");
      container.querySelectorAll('[data-paypal-idx]').forEach(btn => { btn.addEventListener('click', function() { openPaypalCheckout(this.getAttribute('data-amount'), this.getAttribute('data-title')); }); });
    }
    function openPaypalCheckout(amount, title) {
      if (typeof paypal === 'undefined') { alert('PayPal is still loading. Please try again in a moment.'); return; }
      document.getElementById('paypal-modal-container').innerHTML = '';
      paypal.Buttons({
        createOrder: function(data, actions) { return actions.order.create({ purchase_units: [{ amount: { value: amount, currency_code: 'USD' }, description: title, payee: { email_address: PAYPAL_BUSINESS } }] }); },
        onApprove: function(data, actions) { return actions.order.capture().then(function(details) { alert('Payment successful! Thank you, ' + (details.payer.name ? details.payer.name.given_name : '') + '.'); document.getElementById('paypal-modal').style.display = 'none'; document.getElementById('paypal-modal-container').innerHTML = ''; }); },
        onError: function(err) { alert('Payment could not be completed. Please try again or use the Inquire button to contact us.'); }
      }).render('#paypal-modal-container');
      document.getElementById('paypal-modal').style.display = 'flex';
    }
    function escapeHtml(str) { const div = document.createElement("div"); div.textContent = str || ""; return div.innerHTML; }
    function escapeAttr(str) { return JSON.stringify(str || ""); }
    loadInventory();
  </script>
  <div id="paypal-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;align-items:center;justify-content:center;">
    <div style="background:#1c1c1c;border-radius:14px;padding:2rem;max-width:400px;width:90%;border:1px solid #3a3a3a;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
        <h3 style="font-family:'Playfair Display',serif;color:#c9a24b;font-size:1.3rem;">PayPal Checkout</h3>
        <button onclick="document.getElementById('paypal-modal').style.display='none';document.getElementById('paypal-modal-container').innerHTML='';" style="background:none;border:none;color:#b0aca8;font-size:1.5rem;cursor:pointer;">&times;</button>
      </div>
      <div id="paypal-modal-container"></div>
    </div>
  </div>
</body>
</html>
